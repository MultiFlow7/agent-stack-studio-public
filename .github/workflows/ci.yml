name: macOS CI

on:
  push:
    branches:
      - main
      - 'codex/**'
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.13.0
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run project checks
        run: npm run check
      - name: Package and inspect the Intel macOS application
        run: |
          npm run package:mac
          npm run verify:mac-package
          npm run test:e2e:packaged
          npm run release:dry-run -- --reuse-package
